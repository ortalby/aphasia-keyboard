name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build signed APK
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon 2>&1 | tee build.log; then
            # Surface compiler/Gradle errors as annotations (readable from the checks API).
            grep -E "^e: |error:|What went wrong" -A6 build.log | head -c 60000 > errors.txt || true
            split -b 3500 errors.txt part_
            for f in part_*; do
              msg=$(sed -e 's/%/%25/g' "$f" | sed -e ':a;N;$!ba;s/\n/%0A/g' | sed -e 's/\r/%0D/g')
              echo "::error::$msg"
            done
            exit 1
          fi

      - name: Publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk aphasia-keyboard.apk
          gh release create "build-${{ github.run_number }}" aphasia-keyboard.apk \
            --title "גרסה ${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
