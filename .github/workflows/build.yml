name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build signed APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk aphasia-keyboard.apk
          gh release create "build-${{ github.run_number }}" aphasia-keyboard.apk \
            --title "גרסה ${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
